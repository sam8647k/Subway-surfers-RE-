name: Python tooling tests
on:
  push:
    paths:
      - "tooling/**"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "tooling/**"
      - ".github/workflows/python-tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tooling/tests -v
