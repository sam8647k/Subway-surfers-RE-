<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rail Rush — Endless Runner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header><h1>RAIL RUSH</h1><p>Three lanes. One goal. Don't get hit.</p></header>
    <section class="hud" aria-live="polite">
      <span>Score <strong id="score">0</strong></span>
      <span>Coins <strong id="coins">0</strong></span>
      <span>Best <strong id="best">0</strong></span>
    </section>
    <div class="game-wrap">
      <canvas id="game" width="480" height="720" aria-label="Endless runner game"></canvas>
      <div id="overlay" class="overlay">
        <h2 id="overlay-title">Ready?</h2>
        <p id="overlay-copy">Dodge barriers, jump gaps, and collect coins.</p>
        <button id="start">Start running</button>
      </div>
    </div>
    <nav class="controls" aria-label="Game controls">
      <button data-move="left" aria-label="Move left">←</button>
      <button data-move="jump" aria-label="Jump">↑</button>
      <button data-move="roll" aria-label="Roll">↓</button>
      <button data-move="right" aria-label="Move right">→</button>
    </nav>
    <p class="help">Keyboard: ← → move · ↑ jump · ↓ roll · Space start/restart. On mobile, swipe or use buttons.</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
